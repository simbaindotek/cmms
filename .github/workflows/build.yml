name: Build APK from Zip
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract Project Zip Safely
        run: |
          unzip *.zip -d temp_extract
          find temp_extract -maxdepth 2 -name "gradlew" -exec dirname {} \; > target_dir.txt
          TARGET=$(cat target_dir.txt)
          if [ -n "$TARGET" ]; then
            mv $TARGET/* . 2>/dev/null || true
            mv $TARGET/.* . 2>/dev/null || true
          else
            mv temp_extract/* . 2>/dev/null || true
          fi
          rm -rf temp_extract target_dir.txt
          
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Langkah Tambahan: Membuat ulang file gradle-wrapper.jar yang hilang
      - name: Regenerate Missing Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
